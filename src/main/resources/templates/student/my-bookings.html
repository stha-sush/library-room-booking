<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section>

  <h4 class="mb-3">My Bookings</h4>

  <div id="bookingListMsg" class="mb-3"></div>

  <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-secondary">
    You have no bookings.
  </div>

  <div th:if="${!#lists.isEmpty(bookings)}" class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped mb-0">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Room</th>
            <th>Participants</th>
            <th>Status</th>
            <th style="width:120px;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${bookings}">
            <td th:text="${b.bookingDate}"></td>
            <td>
              <span th:text="${b.startTime}"></span>
              -
              <span th:text="${b.endTime}"></span>
            </td>
            <td>
              <div th:text="${b.room.building} + ' ' + ${b.room.roomNumber}"></div>
            </td>
            <td th:text="${b.participants}"></td>
            <td>
              <span class="badge"
                    th:classappend="${b.status.name() == 'CONFIRMED'} ? ' text-bg-success' : ' text-bg-secondary'"
                    th:text="${b.status}">
              </span>
            </td>
            <td>
              <button class="btn btn-outline-danger btn-sm"
                      th:if="${b.status.name() == 'CONFIRMED'}"
                      th:attr="data-booking-id=${b.id}"
                      onclick="cancelBooking(this)">
                Cancel
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</section>
</html>

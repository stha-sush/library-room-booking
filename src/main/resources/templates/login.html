<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section class="row justify-content-center">

  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1">Login</h4>
        <p class="text-muted mb-3">Enter your username and password.</p>

        <form id="loginForm" class="vstack gap-3">
          <div>
            <label class="form-label">Username</label>
            <input class="form-control" name="username" autocomplete="username" required>
          </div>

          <div>
            <label class="form-label">Password</label>
            <input class="form-control" name="password" type="password" autocomplete="current-password" required>
          </div>

          <button class="btn btn-primary" type="submit">Login</button>

          <div id="loginMsg" class="small"></div>
        </form>
      </div>
    </div>
  </div>

</section>
</html>

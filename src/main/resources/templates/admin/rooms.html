<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section>

  <h4 class="mb-3">Rooms</h4>

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <h5 class="card-title mb-3">Create New Room</h5>

      <div id="roomMsg" class="mb-3"></div>

      <form id="createRoomForm" class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Building</label>
          <input class="form-control" name="building" placeholder="Main / Science" required>
        </div>

        <div class="col-md-2">
          <label class="form-label">Floor</label>
          <input class="form-control" type="number" name="floor" min="0" value="1" required>
        </div>

        <div class="col-md-2">
          <label class="form-label">Room Number</label>
          <input class="form-control" name="roomNumber" placeholder="R101" required>
        </div>

        <div class="col-md-2">
          <label class="form-label">Capacity</label>
          <input class="form-control" type="number" name="capacity" min="1" value="4" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Type</label>
          <select class="form-select" name="type" required>
            <option value="INDIVIDUAL">INDIVIDUAL</option>
            <option value="GROUP">GROUP</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label">Status</label>
          <select class="form-select" name="status" required>
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>

        <div class="col-md-3 d-flex align-items-end gap-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="projector" id="projector">
            <label class="form-check-label" for="projector">Projector</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="whiteboard" id="whiteboard">
            <label class="form-check-label" for="whiteboard">Whiteboard</label>
          </div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary">Create Room</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Building</th>
            <th>Floor</th>
            <th>Room</th>
            <th>Capacity</th>
            <th>Type</th>
            <th>Projector</th>
            <th>Whiteboard</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${rooms}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.building}"></td>
            <td th:text="${r.floor}"></td>
            <td th:text="${r.roomNumber}"></td>
            <td th:text="${r.capacity}"></td>
            <td th:text="${r.type}"></td>
            <td th:text="${r.projector}"></td>
            <td th:text="${r.whiteboard}"></td>
            <td th:text="${r.status}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</section>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} ?: 'Library Room Booking'">Library Room Booking</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css">

  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Library Rooms</a>

    <div class="ms-auto d-flex gap-2 align-items-center">
      <a th:if="${!isLoggedIn}" class="btn btn-light btn-sm" th:href="@{/login}">Login</a>

      <a th:if="${isStudent}" class="btn btn-outline-light btn-sm" th:href="@{/student/my-bookings}">
        My Bookings
      </a>

      <button th:if="${isLoggedIn}" id="logoutBtn" class="btn btn-outline-light btn-sm" type="button">
        Logout
      </button>
    </div>
  </div>
</nav>

<main class="container my-4">
  <div th:replace="${content}"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
